[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-bug-hunter"
version = "2.2.0"
description = "Codex-first recon, classification, triage, and reporting runner for Codex-Bug-hunter"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sachin Sharma" }]
keywords = ["security", "bug-bounty", "recon", "codex", "agent-skills", "pentest"]
dependencies = []

[project.optional-dependencies]
# `requests` is optional — cbh falls back to urllib when it's absent.
http = ["requests"]

[project.urls]
Homepage = "https://github.com/Hamoyeah/Codex-Bug-hunter"
Documentation = "https://github.com/Hamoyeah/Codex-Bug-hunter/blob/main/docs/cbh-cli.md"

[project.scripts]
cbh = "cbh.cli:main"

[tool.setuptools]
packages = ["cbh"]

[tool.setuptools.package-data]
cbh = ["data/*.json"]
