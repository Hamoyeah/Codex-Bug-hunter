# GitHub Pages config for the Codex-Bug-hunter docs site.
# Built from the /docs folder. Uses just-the-docs for built-in search.
title: Codex-Bug-hunter
description: >-
  A provider-neutral Agent Skills bundle for OpenAI Codex and Claude Code.
  Includes 84 skills, 681 disclosed-report patterns, enterprise attack
  matrices, and optional Burp MCP integration.
remote_theme: just-the-docs/just-the-docs

url: "https://hamoyeah.github.io"
baseurl: "/Codex-Bug-hunter"

# Search (just-the-docs built-in)
search_enabled: true
search:
  heading_level: 2
  previews: 3

# Repo links in the nav footer
aux_links:
  "GitHub":
    - "https://github.com/Hamoyeah/Codex-Bug-hunter"
  "Sponsor — Atlas Cloud":
    - "https://www.atlascloud.ai/console/coding-plan"
aux_links_new_tab: true

color_scheme: dark
heading_anchors: true

# Don't try to render engineering/meta files as site pages.
exclude:
  - disclosed-reports/
  - verification/
  - automation/
  - "*.py"
  - ".DS_Store"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
